<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Admin Enquiries | ClinicConsilium</title>
<style>
:root{color-scheme:light;--g:#063c31;--g2:#0d5a47;--gold:#c9a45c;--paper:#fffdf8;--line:#e7e2d6;--ink:#1d2c27;--muted:#66736d}*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--g);color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:18px}main{max-width:1240px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.hidden{display:none!important}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}input,select,textarea,button{font:inherit;border-radius:8px;padding:10px 12px;border:1px solid #d6d9d2}input,select,textarea{width:100%;background:white}textarea{min-height:100px;resize:vertical}button{cursor:pointer;background:var(--g);color:white;border-color:var(--g);font-weight:700}button.secondary{background:white;color:var(--g);border-color:var(--line)}button:disabled{opacity:.55;cursor:wait}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.layout{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(320px,1.1fr);gap:18px}.items{display:grid;gap:8px;max-height:65vh;overflow:auto}.item{width:100%;text-align:left;background:white;color:var(--ink);border:1px solid var(--line);font-weight:400}.item.active{border-color:var(--g);background:#f0f6f1}.item strong{display:block}.pill{display:inline-block;background:#edf3ee;border-radius:999px;padding:3px 8px;font-size:11px}.status{margin:12px 0;min-height:20px}.status.error{color:#9b2c2c}.status.ok{color:#216444}.detail{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f8f4;border-radius:8px;padding:12px;max-height:300px;overflow:auto}.fields{display:grid;gap:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.items{max-height:40vh}.split{grid-template-columns:1fr}}
</style></head><body><header><strong>ClinicConsilium · Admin</strong><div><span id="who" class="muted"></span> <button id="logout" class="secondary hidden" type="button">Sign out</button></div></header>
<main><div id="notice" class="status" role="status" aria-live="polite"></div>
<section id="login" class="panel" style="max-width:430px;margin:40px auto"><h1>Administrator sign in</h1><p class="muted">This workspace is restricted. Use the site owner's configured admin password.</p><form id="loginForm"><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><p><button type="submit">Sign in securely</button></p></form></section>
<section id="workspace" class="hidden"><div class="panel"><div class="row"><div><label for="filter">Filter by status</label><select id="filter"><option value="">All statuses</option><option value="new">New</option><option value="in_review">In review</option><option value="awaiting_response">Awaiting response</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div><label for="search">Search loaded enquiries</label><input id="search" type="search" placeholder="Name, email, type or details"></div><div><button id="refresh" type="button">Refresh inbox</button></div></div></div>
<div class="layout"><section class="panel"><h2>Enquiry inbox</h2><p class="muted">Newest first · sensitive clinical information should not be requested here.</p><div id="items" class="items"></div><p><button id="more" class="secondary hidden" type="button">Load more</button></p></section>
<section id="detailPanel" class="panel"><h2>Enquiry details</h2><p class="muted">Select an enquiry to review it.</p><div id="detailBody"></div></section></div></section></main>
<script>
const $=id=>document.getElementById(id);let rows=[],selected=null,offset=0;const limit=50;
function notice(message,type=''){ $('notice').textContent=message;$('notice').className='status '+type; }
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error||'Request failed');return d}
function showWorkspace(){ $('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent='Restricted access';}
function renderList(){const term=$('search').value.toLowerCase();const filtered=rows.filter(x=>[x.name,x.email,x.role,x.details,x.status].join(' ').toLowerCase().includes(term));$('items').replaceChildren();for(const x of filtered){const b=document.createElement('button');b.type='button';b.className='item'+(selected&&selected.id===x.id?' active':'');const n=document.createElement('strong');n.textContent=x.name+' · '+x.role;const p=document.createElement('span');p.textContent=x.email+' · '+new Date(x.created_at).toLocaleString();const s=document.createElement('span');s.className='pill';s.textContent=x.status;b.append(n,p,document.createElement('br'),s);b.addEventListener('click',()=>{selected=x;renderList();renderDetail()});$('items').append(b)}if(!filtered.length){const p=document.createElement('p');p.className='muted';p.textContent='No matching enquiries loaded.';$('items').append(p)}}
function field(label,id,value,tag='input'){const wrap=document.createElement('div');const l=document.createElement('label');l.htmlFor=id;l.textContent=label;const el=document.createElement(tag);el.id=id;if(tag==='textarea')el.value=value||'';else el.value=value||'';wrap.append(l,el);return {wrap,el}}
function renderDetail(){const root=$('detailBody');root.replaceChildren();if(!selected)return;const h=document.createElement('h3');h.textContent=selected.name;const meta=document.createElement('p');meta.className='muted';meta.textContent=selected.email+' · '+selected.role+' · '+new Date(selected.created_at).toLocaleString();const details=document.createElement('div');details.className='detail';details.textContent=selected.details||'(No additional details)';const dataTitle=document.createElement('h4');dataTitle.textContent='Submitted fields';const raw=document.createElement('div');raw.className='detail';raw.textContent=JSON.stringify(selected.form_data||{},null,2);const grid=document.createElement('div');grid.className='fields';const status=field('Status','editStatus',selected.status,'select');for(const [v,t] of [['new','New'],['in_review','In review'],['awaiting_response','Awaiting response'],['resolved','Resolved'],['closed','Closed']]){const o=document.createElement('option');o.value=v;o.textContent=t;status.el.append(o)}status.el.value=selected.status;const assignee=field('Assigned staff email','editAssignee',selected.assigned_to||'');assignee.el.type='email';assignee.el.placeholder='Optional';const notes=field('Internal notes (restricted to admins)','editNotes',selected.internal_notes||'','textarea');const save=document.createElement('button');save.type='button';save.textContent='Save changes';save.addEventListener('click',async()=>{save.disabled=true;try{const d=await api('/api/admin/enquiry?id='+encodeURIComponent(selected.id),{method:'PATCH',body:JSON.stringify({status:status.el.value,assigned_to:assignee.el.value,internal_notes:notes.el.value})});selected=d.enquiry;rows=rows.map(x=>x.id===selected.id?selected:x);renderList();renderDetail();notice('Enquiry updated.','ok')}catch(e){notice(e.message,'error')}finally{save.disabled=false}});grid.append(status.wrap,assignee.wrap,notes.wrap,save);root.append(h,meta,document.createElement('hr'));const dlabel=document.createElement('h4');dlabel.textContent='Enquiry message';root.append(dlabel,details,dataTitle,raw,grid)}
async function load(reset=true){if(reset){offset=0;rows=[];selected=null}notice('Loading enquiries…');try{const status=$('filter').value;const d=await api('/api/admin/enquiries?limit='+limit+'&offset='+offset+(status?'&status='+encodeURIComponent(status):''));rows=rows.concat(d.enquiries);offset+=d.enquiries.length;$('more').classList.toggle('hidden',d.enquiries.length<limit);renderList();renderDetail();notice(rows.length+' enquiries loaded.','ok')}catch(e){notice(e.message,'error');if(/authentication_required/.test(e.message)){$('workspace').classList.add('hidden');$('login').classList.remove('hidden')}}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showWorkspace();await load()}catch(err){notice(err.message,'error')}finally{b.disabled=false}});
$('logout').addEventListener('click',async()=>{try{await api('/api/admin/login',{method:'DELETE',body:'{}'})}catch{}rows=[];selected=null;$('workspace').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');$('who').textContent='';notice('Signed out.')});
$('refresh').addEventListener('click',()=>load());$('more').addEventListener('click',()=>load(false));$('filter').addEventListener('change',()=>load());$('search').addEventListener('input',renderList);
</script></body></html>
