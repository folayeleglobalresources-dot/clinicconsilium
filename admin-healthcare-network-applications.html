<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Healthcare Network Applications | ClinicConsilium</title><link rel="stylesheet" href="assets/site.css"><style>
*{box-sizing:border-box}body{margin:0;background:#F3F6FA;color:#183653;font:14px/1.55 'DM Sans',sans-serif}.top{height:64px;background:#123B6D;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top a{color:#fff;font-size:12px}.wrap{max-width:1300px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #dfe7ef;border-radius:14px;padding:18px}.auth{max-width:420px;margin:50px auto}.field{display:grid;gap:5px;margin:12px 0}.field input{padding:11px;border:1px solid #c8d4e2;border-radius:8px}.btn{border:0;border-radius:8px;padding:9px 12px;background:#123B6D;color:#fff;font-size:11px;font-weight:800;cursor:pointer}.green{background:#0D806A}.red{background:#a43b36}.light{background:#edf3f9;color:#315a83}.hidden{display:none!important}.msg{display:none;padding:10px;margin:12px 0;font-size:12px}.msg.show{display:block}.toolbar{display:flex;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #e2e9f0}.apps{display:grid;gap:12px;padding-top:12px}.app h2{font:700 16px 'Plus Jakarta Sans';margin:0;color:#123B6D}.muted{font-size:11px;color:#66788d}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.details div{background:#f6f8fb;border-radius:8px;padding:9px;overflow-wrap:anywhere}.details b{display:block;font-size:9px;color:#6b7d91;text-transform:uppercase}.details span{font-size:11px}.doc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e5ebf2}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:9px;font-weight:800;padding:4px 7px;border-radius:99px;background:#fff3d9;color:#8a641d}.ok{background:#e4f1e5;color:#27664a}.empty{text-align:center;padding:30px;color:#66788d;font-size:12px}@media(max-width:700px){.wrap{padding:12px}.details{grid-template-columns:1fr 1fr}.top{padding:0 12px}}@media(max-width:480px){.details{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body><header class="top"><b>ClinicConsilium / Applications</b><a href="admin-healthcare-network.html">Listing review ↗</a></header><main class="wrap"><h1 style="font:800 27px 'Plus Jakarta Sans';color:#123B6D">Applications and credential review</h1><p class="muted">Inspect private evidence, record review decisions and create unpublished listing drafts from accepted applications.</p>
<section id="login" class="panel auth"><h2>Administrator sign-in</h2><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn">Sign in</button></form><div id="loginMsg" class="msg"></div></section>
<section id="workspace" class="hidden"><div class="panel"><div class="toolbar"><b id="count">Applications</b><select id="filter"><option value="">All statuses</option><option value="pending_review">Pending review</option><option value="in_review">In review</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option><option value="converted">Converted</option></select></div><div id="apps" class="apps"><div class="empty">Loading…</div></div></div></section><div id="globalMsg" class="msg"></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const $=id=>document.getElementById(id),cfg=await fetch('/api/admin/config').then(r=>r.json()).catch(()=>null),sb=cfg&&cfg.ok?createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(el,t){el.textContent=t;el.className='msg show';}
async function tok(){const{data:{session}}=await sb.auth.getSession();return session?.access_token||'';}
async function call(url,method='GET',body){const r=await fetch(url,{method,headers:{Authorization:'Bearer '+await tok(),'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'request_failed');return d;}
async function docOpen(id){const w=window.open('about:blank','_blank');try{const d=await call('/api/admin/healthcare-network?resource=documents&id='+encodeURIComponent(id));if(w)w.location=d.url;else location.href=d.url;}catch(e){if(w)w.close();msg($('globalMsg'),e.message);}}
async function docReview(id,status){try{await call('/api/admin/healthcare-network?resource=documents&id='+encodeURIComponent(id),'PATCH',{status});await load();}catch(e){msg($('globalMsg'),e.message);}}
async function appStatus(id,status){const note=prompt('Optional internal review note:')||'';try{await call('/api/admin/healthcare-network?resource=applications','PATCH',{id,status,review_notes:note});await load();}catch(e){msg($('globalMsg'),e.message);}}
async function convert(id){if(!confirm('Create an unpublished listing draft from this accepted application?'))return;try{await call('/api/admin/healthcare-network?resource=applications','POST',{id,action:'create_listing'});await load();}catch(e){msg($('globalMsg'),e.message);}}
function render(){ $('count').textContent=rows.length+' application(s)';$('apps').innerHTML=rows.length?rows.map(a=>{const ds=a.documents||[],hasAccepted=ds.some(d=>d.review_status==='accepted');return '<article class="panel app"><div style="display:flex;justify-content:space-between;gap:12px"><div><h2>'+esc(a.organisation_name)+'</h2><div class="muted">'+esc(a.application_type)+' · '+new Date(a.created_at).toLocaleString()+'</div></div><span class="tag '+(a.status==='accepted'||a.status==='converted'?'ok':'')+'">'+esc(a.status)+'</span></div><div class="details"><div><b>Contact</b><span>'+esc(a.contact_name)+' · '+esc(a.contact_email)+'</span></div><div><b>Location</b><span>'+esc([a.city,a.state_region,a.country_code].filter(Boolean).join(', '))+'</span></div><div><b>Phone / role</b><span>'+esc([a.phone,a.professional_title].filter(Boolean).join(' · '))+'</span></div><div><b>Regulatory body</b><span>'+esc(a.registration_body)+'</span></div><div><b>Licence reference</b><span>'+esc(a.registration_reference)+'</span></div><div><b>Specialty</b><span>'+esc(a.specialty)+'</span></div><div><b>Services</b><span>'+esc(a.services)+'</span></div><div><b>Website</b><span>'+esc(a.website)+'</span></div><div><b>Participation</b><span>'+esc(a.participation_interest)+'</span></div></div><div><b class="muted">Private credential evidence ('+ds.length+')</b>'+(ds.length?ds.map(d=>'<div class="doc"><span>'+esc(d.original_filename)+' · <span class="tag '+(d.review_status==='accepted'?'ok':'')+'">'+esc(d.review_status)+'</span></span><div class="actions"><button class="btn light" data-open="'+d.id+'">Open</button>'+(d.review_status!=='accepted'?'<button class="btn green" data-doc="'+d.id+'" data-status="accepted">Accept</button>':'')+(d.review_status!=='rejected'?'<button class="btn red" data-doc="'+d.id+'" data-status="rejected">Reject</button>':'')+'</div></div>').join(''):'<p class="muted">No evidence uploaded.</p>')+'</div><div class="actions">'+(a.status==='pending_review'?'<button class="btn" data-app="'+a.id+'" data-status="in_review">Mark in review</button>':'')+(a.status!=='accepted'&&a.status!=='converted'&&a.status!=='rejected'?'<button class="btn green" data-app="'+a.id+'" data-status="accepted">Accept application</button>':'')+(a.status!=='rejected'&&a.status!=='converted'?'<button class="btn red" data-app="'+a.id+'" data-status="rejected">Reject application</button>':'')+(a.status==='accepted'&&hasAccepted&&!a.listing_id?'<button class="btn green" data-convert="'+a.id+'">Create unpublished listing</button>':'')+(a.listing_id?'<a class="btn light" href="admin-healthcare-network.html">Review listing</a>':'')+'</div></article>';}).join(''):'<div class="empty">No applications in this view.</div>';
$('apps').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>docOpen(b.dataset.open));$('apps').querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>docReview(b.dataset.doc,b.dataset.status));$('apps').querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>appStatus(b.dataset.app,b.dataset.status));$('apps').querySelectorAll('[data-convert]').forEach(b=>b.onclick=()=>convert(b.dataset.convert));}
async function load(){try{const s=$('filter').value,d=await call('/api/admin/healthcare-network?resource=applications'+(s?'&status='+encodeURIComponent(s):''));rows=d.applications||[];render();}catch(e){msg($('globalMsg'),e.message);}}
async function show(){if(!sb){msg($('loginMsg'),'Sign-in service unavailable.');return;}const{data:{session}}=await sb.auth.getSession();if(session){$('login').classList.add('hidden');$('workspace').classList.remove('hidden');await load();}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await show();}catch(e){msg($('loginMsg'),e.message);}});$('filter').addEventListener('change',load);if(sb){sb.auth.onAuthStateChange((_e,s)=>{if(!s){$('workspace').classList.add('hidden');$('login').classList.remove('hidden');}});await show();}
</script></body></html>
